<!DOCTYPE html>
<html lang="es">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Cookie&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiblioFa</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon -->
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="BiblioFa">
<link rel="manifest" href="site.webmanifest">


</head>
<body>
  <header class="site-header">
  <nav class="navbar">
    <div class="site-title-wrap">
      <h1 class="site-title editorial">
        <strong>Biblioteca</strong>
        <span>Fátima Ll</span>
      </h1>
      <p class="site-tagline">mis recomendaciones, sin filtro</p>
    </div>
    <div class="header-pills">
      <a class="header-pill" href="https://fatimallovet.github.io/videotecafatima/" target="_blank">
        <span>🎬</span><span class="pill-text">Videoteca</span>
      </a>
      <a class="header-pill header-pill--gold" href="https://www.buymeacoffee.com/fatimallovet" target="_blank">
        <span>👍</span><span class="pill-text">Apoyar</span>
      </a>
    </div>
  </nav>
  </header>

 <main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="tabLibros">📚 Lista</button>
    <button class="tab-btn" data-tab="tabGeneros">🎭 Géneros</button>
    <button class="tab-btn" data-tab="tabSentimiento">👀 Mood</button>  
    <button class="tab-btn" data-tab="tabAbout">ℹ️ Info</button>
  </div>

  <!-- Pestaña principal -->
  <section id="tabLibros" class="tab active">
    <div class="section-header">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="busqueda" type="text" placeholder="Buscar por título, autor, género...">
      </div>
      <select id="ordenSelect" class="orden-select">
        <option value="recientes">Últimos agregados</option>
        <option value="calificacion">Mejor calificación</option>
      </select>
    </div>

    <div id="listaCards" class="lista-cards"></div>

    <p id="contadorLibros" class="contador"></p>
  </section> 


  <!-- Pestaña de géneros -->
  <section id="tabGeneros" class="tab">
    <h2>Filtrar por género</h2>
    <div id="generoBtns" class="genero-btns"></div>
    <div id="tarjetasLibros" class="tarjetas"></div>
  </section>



<section id="tabAbout" class="tab">
  <div id="infoContenido"><p style="color:var(--muted)">Cargando...</p></div>
</section>




<section id="tabSentimiento" class="tab">
  <div id="sentimientoGrid" class="sentimiento-grid">
    <button class="sentimiento-btn" data-mood="evadir">
      <span class="mood-icon">🌙</span>
      <span class="mood-label">Quiero evadir<br>la realidad</span>
    </button>
    <button class="sentimiento-btn" data-mood="reir">
      <span class="mood-icon">😂</span>
      <span class="mood-label">Solo quiero<br>divertirme</span>
    </button>
    <button class="sentimiento-btn" data-mood="llorar">
      <span class="mood-icon">😮‍💨</span>
      <span class="mood-label">Quiero muchas<br>emociones</span>
    </button>
    <button class="sentimiento-btn" data-mood="aprender">
      <span class="mood-icon">🧠</span>
      <span class="mood-label">Quiero<br>aprender algo</span>
    </button>
    <button class="sentimiento-btn" data-mood="crecer">
      <span class="mood-icon">🌱</span>
      <span class="mood-label">Quiero crecer<br>por dentro</span>
    </button>
    <button class="sentimiento-btn" data-mood="tension">
      <span class="mood-icon">😬</span>
      <span class="mood-label">Quiero intriga<br>y tensión</span>
    </button>
    <button class="sentimiento-btn" data-mood="clasico">
      <span class="mood-icon">📜</span>
      <span class="mood-label">Me apetece<br>un clásico</span>
    </button>
    <button class="sentimiento-btn" data-mood="ligero">
      <span class="mood-icon">☁️</span>
      <span class="mood-label">Algo ligero<br>y sin drama</span>
    </button>
  </div>

  <div id="sentimientoResultado" class="sentimiento-resultado" style="display:none">
    <div class="sentimiento-header">
      <button id="btnVolver" class="btn-volver">← Cambiar estado de ánimo</button>
      <p id="sentimientoContador" class="contador"></p>
    </div>
    <div id="sentimientoTarjetas" class="tarjetas"></div>
  </div>
</section>

</main>

  <footer>
    <p>&copy; 2025 Proyecto Biblioteca Fátima</p>
  </footer>

  <!-- Modal Detalle -->
  <div id="detalleModal" class="modal hidden">
    <div class="modal-content">

      <div id="detalleContenido"></div>
    </div>
  </div>


  <!-- FAB Random 🎲 -->
  <button id="randomFab" class="random-fab" aria-label="Libro al azar">🎲</button>

  <!-- Modal Random -->
  <div id="randomModal" class="rm-overlay hidden">
    <div class="rm-box">
      <div class="rm-header">
        <h3 id="randomModalTitulo" class="rm-titulo">Libro al azar</h3>
        <div class="rm-header-actions">
          <button id="btnOtroRandom" class="rm-btn-otro">Otro →</button>
          <button id="cerrarRandomModal" class="rm-cerrar" aria-label="Cerrar">&times;</button>
        </div>
      </div>
      <div id="randomModalCuerpo" class="rm-cuerpo"></div>
      <div id="randomModalAcciones" class="rm-acciones">
        <button id="randomModalBtnAntojo" class="btn-modal-antojo">✓ Guardar en antojos</button>
        <button id="randomModalBtnCompartir" class="btn-modal-compartir">↗ Compartir</button>
      </div>
    </div>
  </div>

  <!-- Panel de Antojos flotante -->
  <button id="antojosBtn" class="antojos-fab" style="display:none" aria-label="Mis antojos">
    <span>🤤</span>
    <span id="antojosCount" class="antojos-count">0</span>
  </button>

  <div id="antojosPanel" class="antojos-panel hidden">
    <div class="antojos-panel-header">
      <strong>Mis antojos</strong>
      <button id="antojosCerrar" class="antojos-cerrar">✕</button>
    </div>
    <ul id="antojosLista" class="antojos-lista"></ul>
    <div class="antojos-footer-actions">
      <button id="btnCompartirTodos" class="btn-antojos-primary">↗ Compartir lista</button>
      <button id="btnVaciarAntojos" class="btn-antojos-secondary">🗑️ Vaciar todo</button>
    </div>
  </div>

  <!-- Modal compartir desktop -->
  <div id="shareModal" class="share-modal hidden">
    <div class="share-modal-box">
      <div class="share-modal-header">
        <strong>Compartir</strong>
        <button id="shareModalCerrar" class="antojos-cerrar">✕</button>
      </div>
      <div class="share-modal-body">
        <button id="shareWhatsapp" class="share-option">💬 Enviar por WhatsApp</button>
        <button id="shareCopiar" class="share-option">📋 Copiar al portapapeles</button>
      </div>
    </div>
  </div>
  <!-- Barra de navegación inferior (solo móvil) -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="bn-item active" data-tab="tabLibros">
      <span class="bn-icon">📚</span>
      <span class="bn-label">Lista</span>
    </button>
    <button class="bn-item" data-tab="tabGeneros">
      <span class="bn-icon">🎭</span>
      <span class="bn-label">Géneros</span>
    </button>
    <button class="bn-item" data-tab="tabSentimiento">
      <span class="bn-icon">👀</span>
      <span class="bn-label">Mood</span>
    </button>
    <button class="bn-item" data-tab="tabAbout">
      <span class="bn-icon">ℹ️</span>
      <span class="bn-label">Info</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js?v=1.1.0"></script>

  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "85978fa0985645ffb561da2af953aad6"}'>
  </script>
  <!-- End Cloudflare Web Analytics -->


</body>
</html>
