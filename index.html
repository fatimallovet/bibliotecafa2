<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Fátima</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <h1>Biblioteca Fátima</h1>
      <ul class="menu">
        <li data-tab="tabla" class="active">Tabla</li>
        <li data-tab="tarjetas">Tarjetas</li>
        <li data-tab="generos">Géneros</li>
        <li data-tab="random">Random</li>
      </ul>
      <div class="nav-controls">
        <button id="btnLightDark" title="Cambiar tema">🌙</button>
      </div>
    </nav>
  </header>

  <main>
    <!-- TAB: TABLA -->
    <section id="tab-tabla" class="tab-section active">
      <div class="section-header">
        <h2>Listado de Libros</h2>
        <input id="busqueda" type="text" placeholder="🔍 Buscar por título, género, autor o palabras clave...">
      </div>
      <table id="tablaLibros">
        <thead>
          <tr>
            <th data-sort="calificacion">Calificación</th>
            <th data-sort="titulo">Título</th>
            <th data-sort="autor">Autor</th>
            <th data-sort="genero">Género</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="contadorLibros" class="contador"></p>
    </section>

    <!-- TAB: TARJETAS -->
    <section id="tab-tarjetas" class="tab-section">
      <h2>Vista en Tarjetas</h2>
      <div id="tarjetasLibros" class="tarjetas"></div>
    </section>

    <!-- TAB: GÉNEROS -->
    <section id="tab-generos" class="tab-section">
      <h2>Filtrar por Género</h2>
      <select id="generoSelect">
        <option value="">Todos</option>
      </select>
      <div id="generoResultados" class="tarjetas"></div>
    </section>

    <!-- TAB: RANDOM -->
    <section id="tab-random" class="tab-section">
      <h2>Libro al Azar</h2>
      <button id="btnRandom">🎲 Dame un libro random</button>
      <div id="randomLibro" class="random"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Biblioteca Fátima</p>
  </footer>

  <!-- Modal Detalle -->
  <div id="detalleModal" class="modal hidden">
    <div class="modal-content">
      <span id="cerrarModal" class="close">&times;</span>
      <div id="detalleContenido"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
