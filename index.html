<!DOCTYPE html>
<html lang="es">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Cookie&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Fátima</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
  <nav class="navbar">
    <h1 class="site-title editorial">
      span>Biblioteca</span>
      <strong>Fátima Ll</strong>
<   /h1>

    <a class="video-pill" href="https://fatimallovet.github.io/videotecafatima/" target="_blank">
      🎬 Videoteca
    </a>
  </nav>

   
  </header>

 <main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="tabLibros">📚 Lista</button>
    <button class="tab-btn" data-tab="tabGeneros">🎭 Géneros</button>
    <button class="tab-btn" data-tab="tabRandom">🎲 Random</button>   <!-- NUEVO -->
        <!-- BOTÓN BUYMEACOFFEE -->
    <a class="btn-bmc" href="https://www.buymeacoffee.com/fatimallovet" target="_blank">☕ Buy me a coffee</a>
   

  </div>

  <!-- Pestaña principal -->
  <section id="tabLibros" class="tab active">
    <div class="section-header">
      <h2>🔍</h2>
      <input id="busqueda" type="text" placeholder="Buscar por título, género, autor o palabras clave...">
    </div>

    <table id="tablaLibros">
      <thead>
        <tr>
          <th data-sort="calificacion">Calificación</th>
          <th data-sort="titulo">Título</th>
          <th data-sort="autor">Autor</th>
          <th data-sort="genero">Género</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p id="contadorLibros" class="contador"></p>
</section> 


  <!-- Pestaña de géneros -->
  <section id="tabGeneros" class="tab">
    <h2>Filtrar por Género</h2>
    <select id="generoSelect">
      <option value="">Todos</option>
    </select>
    <div id="tarjetasLibros" class="tarjetas"></div>
  </section>


<section id="tabRandom" class="tab">
  <h2>Libro al Azar</h2>
  <button id="btnRandom">🎲 Dame un libro random</button>
  <div id="randomLibro" class="random"></div>
</section>


</main>

  <footer>
    <p>&copy; 2025 Biblioteca Fátima</p>
  </footer>

  <!-- Modal Detalle -->
  <div id="detalleModal" class="modal hidden">
    <div class="modal-content">

      <div id="detalleContenido"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js?v=1.0.6"></script>
</body>
</html>
