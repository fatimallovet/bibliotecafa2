<!DOCTYPE html>
<html lang="es">
<head>
    
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PD7KRF1SW0"></script>
    <script>

      gtag('config', 'G-PD7KRF1SW0');

  <link href="https://fonts.googleapis.com/css2?family=Cookie&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiblioFa</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.7.0" />

  <!-- Favicon -->
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="BiblioFa">
<link rel="manifest" href="site.webmanifest">


</head>
<body>
  <!-- Barra superior — solo visible en móvil/tablet -->
  <div class="mobile-topbar">
    <button id="menuToggle" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-topbar-title"><strong>Biblioteca</strong> Fátima</span>
  </div>

  <!-- Fondo oscuro al abrir el menú en móvil -->
  <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button id="sidebarClose" class="sidebar-close" aria-label="Cerrar menú">&times;</button>
      <h1 class="site-title editorial">
        <strong>Biblioteca</strong>
        <span>Fátima Ll</span>
      </h1>
      <p class="site-tagline">mis recomendaciones, sin filtro</p>
    </div>

    <div class="sidebar-nav">
      <button class="sidebar-link active" data-tab="tabLibros"><span class="sidebar-link-icon">📚</span> Lista</button>
      <button class="sidebar-link" data-tab="tabGeneros"><span class="sidebar-link-icon">🎭</span> Géneros</button>
      <button class="sidebar-link" data-tab="tabSentimiento"><span class="sidebar-link-icon">👀</span> Mood</button>
      <button class="sidebar-link" data-tab="tabAbout"><span class="sidebar-link-icon">ℹ️</span> Info</button>
    </div>

    <div class="sidebar-actions">
      <button id="randomFab" class="sidebar-link" aria-label="Libro al azar">
        <span class="sidebar-link-icon">🎲</span> Libro al azar
      </button>
      <button id="antojosBtn" class="sidebar-link" style="display:none" aria-label="Mis antojos">
        <span class="sidebar-link-icon">🤤</span> Mis antojos
        <span id="antojosCount" class="antojos-count">0</span>
      </button>
    </div>

    <div class="sidebar-footer">
      <a class="sidebar-link" href="https://fatimallovet.github.io/videotecafatima/" target="_blank">
        <span class="sidebar-link-icon">🎬</span> Videoteca
      </a>
      <a class="sidebar-link sidebar-link-gold" href="https://www.buymeacoffee.com/fatimallovet" target="_blank">
        <span class="sidebar-link-icon">👍</span> Apoyar
      </a>
    </div>
  </nav>

 <main>

  <!-- Pestaña principal -->
  <section id="tabLibros" class="tab active">
    <div class="section-header">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="busqueda" type="text" placeholder="Buscar por título, autor, género...">
      </div>
      <div class="orden-wrap">
        <select id="ordenSelect" class="orden-select">
          <option value="recientes">Agregado</option>
          <option value="calificacion">Calificación</option>
          <option value="publicacion">Año de publicación</option>
        </select>
        <button id="ordenDireccion" class="orden-dir-btn" type="button" aria-label="Cambiar dirección de orden" title="Descendente">↓</button>
      </div>
    </div>

    <div id="listaCards" class="lista-cards"></div>

    <p id="contadorLibros" class="contador"></p>
  </section> 


  <!-- Pestaña de géneros -->
  <section id="tabGeneros" class="tab">
    <h2>Filtrar por género</h2>
    <div id="generoBtns" class="genero-btns"></div>
    <div id="tarjetasLibros" class="tarjetas"></div>
  </section>



<section id="tabAbout" class="tab">
  <div id="infoContenido"><p style="color:var(--muted)">Cargando...</p></div>
</section>




<section id="tabSentimiento" class="tab">
  <div id="sentimientoGrid" class="sentimiento-grid">
    <button class="mood-card" data-mood="feliz">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">01</span>
      <span class="mood-card-icon">😂</span>
      <span class="mood-card-title">Algo que me haga feliz</span>
      <span class="mood-card-desc">Comedias y finales que sacan una sonrisa</span>
    </button>
    <button class="mood-card" data-mood="drama">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">02</span>
      <span class="mood-card-icon">💔</span>
      <span class="mood-card-title">Puro drama</span>
      <span class="mood-card-desc">Historias profundas, de las que remueven algo</span>
    </button>
    <button class="mood-card" data-mood="atrapar">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">03</span>
      <span class="mood-card-icon">🕵️</span>
      <span class="mood-card-title">No lo puedes soltar</span>
      <span class="mood-card-desc">Ritmo ágil, tensión, páginas que se devoran</span>
    </button>
    <button class="mood-card" data-mood="aventura">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">04</span>
      <span class="mood-card-icon">⚔️</span>
      <span class="mood-card-title">Vivir una aventura</span>
      <span class="mood-card-desc">Misión, riesgo y camino por recorrer</span>
    </button>
    <button class="mood-card" data-mood="pasado">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">05</span>
      <span class="mood-card-icon">🏰</span>
      <span class="mood-card-title">Viajar al pasado</span>
      <span class="mood-card-desc">Otras épocas, reales o noveladas</span>
    </button>
    <button class="mood-card" data-mood="reflexion">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">06</span>
      <span class="mood-card-icon">🌿</span>
      <span class="mood-card-title">Para reflexionar</span>
      <span class="mood-card-desc">Libros que te hacen pensar distinto</span>
    </button>
    <button class="mood-card" data-mood="inspiracion">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">07</span>
      <span class="mood-card-icon">💪</span>
      <span class="mood-card-title">Necesito inspiración</span>
      <span class="mood-card-desc">Historias reales de superación</span>
    </button>
    <button class="mood-card" data-mood="buenrato">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">08</span>
      <span class="mood-card-icon">☁️</span>
      <span class="mood-card-title">Para pasar un buen rato</span>
      <span class="mood-card-desc">Ligero, ameno, sin complicarse</span>
    </button>
    <button class="mood-card" data-mood="clasico">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">09</span>
      <span class="mood-card-icon">👑</span>
      <span class="mood-card-title">Volver a los clásicos</span>
      <span class="mood-card-desc">Los que nunca pasan de moda</span>
    </button>
    <button class="mood-card" data-mood="escapar">
      <span class="mood-card-fold"></span>
      <span class="mood-card-num">10</span>
      <span class="mood-card-icon">🌌</span>
      <span class="mood-card-title">Escapar de la realidad</span>
      <span class="mood-card-desc">Fantasía, ciencia ficción, otros mundos</span>
    </button>
  </div>

  <div id="sentimientoResultado" class="sentimiento-resultado" style="display:none">
    <div class="sentimiento-header">
      <button id="btnVolver" class="btn-volver">← Cambiar estado de ánimo</button>
    </div>
    <h2 id="sentimientoTitulo" class="sentimiento-titulo"></h2>
    <p id="sentimientoContador" class="contador contador-mood"></p>
    <div id="sentimientoTarjetas" class="tarjetas"></div>
  </div>
</section>

</main>

  <footer>
    <p>&copy; 2025 Proyecto Biblioteca Fátima</p>
  </footer>

  <!-- Modal Detalle -->
  <div id="detalleModal" class="modal hidden">
    <div class="modal-content">

      <div id="detalleContenido"></div>
    </div>
  </div>


  <!-- Modal Random -->
  <div id="randomModal" class="rm-overlay hidden">
    <div class="modal-content rm-content">
      <div id="randomModalCuerpo"></div>
      <div id="randomModalAcciones" class="modal-actions">
        <button id="btnOtroRandom" class="rm-btn-otro">🎲 Otro →</button>
        <button id="randomModalBtnAntojo" class="btn-modal-antojo">✓ Guardar en antojos</button>
        <button id="randomModalBtnCompartir" class="btn-modal-compartir">↗ Compartir</button>
      </div>
    </div>
  </div>

  <!-- Panel de Antojos (overlay centrado, igual que los demás modales) -->
  <div id="antojosPanel" class="antojos-panel hidden">
    <div class="antojos-panel-box">
      <div class="antojos-panel-header">
        <strong>Mis antojos</strong>
        <button id="antojosCerrar" class="antojos-cerrar">✕</button>
      </div>
      <ul id="antojosLista" class="antojos-lista"></ul>
      <div class="antojos-footer-actions">
        <button id="btnCompartirTodos" class="btn-antojos-primary">↗ Compartir lista</button>
        <button id="btnVaciarAntojos" class="btn-antojos-secondary">🗑️ Vaciar todo</button>
      </div>
    </div>
  </div>

  <!-- Modal compartir desktop -->
  <div id="shareModal" class="share-modal hidden">
    <div class="share-modal-box">
      <div class="share-modal-header">
        <strong>Compartir</strong>
        <button id="shareModalCerrar" class="antojos-cerrar">✕</button>
      </div>
      <div class="share-modal-body">
        <button id="shareWhatsapp" class="share-option">💬 Enviar por WhatsApp</button>
        <button id="shareCopiar" class="share-option">📋 Copiar al portapapeles</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js?v=1.7.0"></script>

  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "85978fa0985645ffb561da2af953aad6"}'>
  </script>
  <!-- End Cloudflare Web Analytics -->


</body>
</html>
